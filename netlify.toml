[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  # Vite only — avoid copy-god-tables wiping public/tables on every Netlify Dev start.
  # That mass rewrite rebundles functions-serve and can trigger Windows EBUSY during reloads.
  # Run `node scripts/copy-god-tables-to-public.mjs` after GOD table changes, or use `npm run dev`.
  command = "vite"
  targetPort = 5173
  framework = "#custom"

[[headers]]
  for = "/*"
  [headers.values]
    # Google Identity Services OAuth popups need postMessage back to the opener.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
